<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空位引导 · 智慧停车</title><link rel="stylesheet" href="/style.css"><script src="/driver.js" defer></script></head><body><main>
<header><div><div class="eyebrow">SMART PARKING</div><h1>少一点等待，多一点节能。</h1><p class="muted">双车位空位引导与按需照明</p></div><a href="/admin">管理员</a></header>
<section class="hero" aria-live="polite"><p id="operating">正在连接停车场</p><div class="count" id="count">—</div><p id="hint">正在获取硬件数据…</p></section>
<div id="connection" class="notice" role="status">等待设备状态</div><section class="grid" id="bays" aria-label="车位位置与状态"></section>
<div class="panel"><strong>如何找到空位</strong><p>查看 P1、P2 的最近检测结果，到达现场后查看对应车位的空位指示。页面中绿色圆点表示指示亮起，灰色圆点表示熄灭；状态未知时显示“未知”。</p><p class="muted">车辆进出时，局部照明临时全亮；稳定后恢复基本照明。</p></div>
<p class="footer">信息仅供参考，不代表预留车位；到达时请以现场情况为准。此页面为课程模型，位置图表示模型中并排的两个车位。</p>
</main></body></html>
