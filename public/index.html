<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能停车照明</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fa;
      color: #172b4d;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 900px; margin: auto; padding: 32px 20px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #65758b; }
    .summary {
      padding: 24px;
      margin: 24px 0;
      border-radius: 16px;
      background: #172b4d;
      color: white;
      font-size: 22px;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border-top: 6px solid #94a3b8;
    }
    .free { border-color: #16865a; }
    .occupied { border-color: #d48b19; }
    .state { font-size: 22px; font-weight: bold; }
    #message { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>智能停车照明</h1>
    <p class="muted">三车位实时状态 · 每2秒更新</p>

    <div id="summary" class="summary">正在获取车位信息…</div>
    <p id="source" class="muted"></p>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="cards" aria-label="车位列表"></section>

<section style="margin-top: 28px;">
  <h2>模拟车辆操作</h2>
  <p class="muted">仅供开发测试，不代表真实设备数据。</p>

  <label for="bay-select">选择车位：</label>

  <select id="bay-select">
    <option value="P1">P1</option>
    <option value="P2">P2</option>
    <option value="P3">P3</option>
  </select>

  <button id="enter-button" type="button">模拟进入</button>
  <button id="leave-button" type="button">模拟离开</button>

  <p id="simulation-message" role="status"></p>
</section>

    <p id="updated" class="muted"></p>
  </main>

  <script>
    const summary = document.querySelector("#summary");
    const cards = document.querySelector("#cards");
    const message = document.querySelector("#message");
    const source = document.querySelector("#source");
    const updated = document.querySelector("#updated");

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;
      element.className = className;
      parent.appendChild(element);
    }

function render(data) {
  if (!Array.isArray(data.bays)) {
    throw new Error("车位数据格式错误");
  }

  const isOffline = bay =>
    bay.data_source === "hardware" && bay.online !== true;

  const available = data.bays.filter(
    bay => !isOffline(bay) && bay.occupancy === "free"
  ).length;

  const offlineCount = data.bays.filter(isOffline).length;

  summary.textContent =
    `可用车位：${available} / ${data.bays.length}` +
    (offlineCount > 0 ? `，设备离线：${offlineCount}` : "");

  const sourceLabels = {
    simulation: "当前为模拟数据",
    hardware: "当前为设备上报数据",
    mixed: "当前包含硬件与模拟数据，可用车位统计包含模拟车位"
  };

  source.textContent =
    sourceLabels[data.data_source] || "数据来源未标明";

  cards.replaceChildren();

  for (const bay of data.bays) {
    const card = document.createElement("article");

    const hardware = bay.data_source === "hardware";
    const offline = isOffline(bay);

    const state =
      !offline && ["free", "occupied"].includes(bay.occupancy)
        ? bay.occupancy
        : "unknown";

    card.className = `card ${state}`;

    const labels = {
      free: "空闲 · 可停车",
      occupied: "已占用",
      unknown: "状态未知"
    };

    const stateText = offline
      ? "设备离线 · 无法确认车位"
      : hardware && state === "unknown"
        ? "设备在线 · 测距状态未知"
        : labels[state];

    const brightness =
      !offline && Number.isFinite(bay.brightness_pct)
        ? `${bay.brightness_pct}%`
        : "—";

    const distance =
      !offline && Number.isFinite(bay.distance_cm)
        ? `${bay.distance_cm.toFixed(1)} cm`
        : "—";

    addText(card, "h2", bay.bay_id);
    addText(card, "p", stateText, "state");

    addText(
      card,
      "p",
      hardware
        ? `数据来源：硬件 · ${offline ? "离线" : "在线"}`
        : "数据来源：模拟"
    );

    addText(card, "p", `检测距离：${distance}`);
    addText(card, "p", `灯光设定：${brightness}`);

    addText(
      card,
      "p",
      `模式：${bay.mode === "auto" ? "自动" : "手动"}`
    );

    if (hardware) {
      const lastSeen = bay.last_seen
        ? new Date(bay.last_seen)
        : null;

      const lastSeenText =
        lastSeen && Number.isFinite(lastSeen.getTime())
          ? lastSeen.toLocaleString()
          : "尚未收到数据";

      addText(card, "p", `最近上报：${lastSeenText}`);
    }

    cards.appendChild(card);
  }
}

    async function refresh() {
      try {
        const response = await fetch("/api/parking", {
          cache: "no-store",
          signal: AbortSignal.timeout(5000)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        render(await response.json());
        message.textContent = "后端连接正常";
        updated.textContent =
          `页面最近获取时间：${new Date().toLocaleTimeString()}`;
      } catch (error) {
        summary.textContent = "暂时无法确认可用车位";
        message.textContent = "连接失败，正在重试…";
        cards.replaceChildren();
        console.error(error);
      } finally {
        setTimeout(refresh, 2000);
      }
    }

const baySelect = document.querySelector("#bay-select");
const enterButton = document.querySelector("#enter-button");
const leaveButton = document.querySelector("#leave-button");
const simulationMessage =
  document.querySelector("#simulation-message");

async function simulateVehicle(occupancy) {
  enterButton.disabled = true;
  leaveButton.disabled = true;
  simulationMessage.textContent = "正在提交…";

  try {
    const response = await fetch("/api/simulation/occupancy", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        bay_id: baySelect.value,
        occupancy
      }),
      signal: AbortSignal.timeout(5000)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "操作失败");
    }

    simulationMessage.textContent =
      result.message + "，车位卡片将在下一次刷新时更新。";
  } catch (error) {
    simulationMessage.textContent =
      "操作未确认：" + error.message;
  } finally {
    enterButton.disabled = false;
    leaveButton.disabled = false;
  }
}

enterButton.addEventListener("click", () => {
  simulateVehicle("occupied");
});

leaveButton.addEventListener("click", () => {
  simulateVehicle("free");
});

    refresh();
  </script>
</body>
</html>
